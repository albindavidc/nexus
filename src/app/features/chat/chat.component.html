<div class="chat-layout">
  <app-chat-sidebar
    [groups]="groups"
    [conversations]="conversations"
    (tabChange)="onTabChange($event)"
    (selectChat)="onChatSelected($event)"
    (presenceChange)="onPresenceChange()"
  ></app-chat-sidebar>

  <ng-container *ngIf="currentTab === 'CHAT'">
    <app-direct-chat
      [activeChat]="activeDirectChat"
      (groupAction)="onGroupAction($event)"
    ></app-direct-chat>
  </ng-container>

  <ng-container *ngIf="currentTab === 'GROUPS'">
    <app-group-chat
      [activeChat]="activeGroupChat"
      (groupAction)="onGroupAction($event)"
    ></app-group-chat>
  </ng-container>

  <ng-container *ngIf="currentTab === 'AI COACH'">
    <app-ai-chat></app-ai-chat>
  </ng-container>

  <ng-container *ngIf="currentTab === 'NOTIFICATIONS'">
    <app-notifications></app-notifications>
  </ng-container>
</div>
