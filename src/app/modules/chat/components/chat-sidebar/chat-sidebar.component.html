<aside class="sidebar">
  <!-- Header -->
  <header class="sidebar-header">
    <div class="logo">
      <div class="logo-box">
        <svg class="lightning-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <span class="logo-text">NEXUS</span>
    </div>
    <button class="btn-icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
      </svg>
    </button>
  </header>

  <!-- Navigation Tabs -->
  <nav class="nav-tabs">
    @for (tab of tabs; track tab) {
      <button 
        class="tab-btn" 
        [class.active]="activeTab === tab"
        (click)="setTab(tab)">
        @if(tab === 'HOME') {
          <svg class="tab-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        }
        @if(tab === 'GROUPS') {
          <svg class="tab-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        }
        @if(tab === 'PROFILE') {
          <svg class="tab-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        }
        {{ tab }}
      </button>
    }
  </nav>

  <!-- Search Bar -->
  <div class="search-container">
    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
    </svg>
    <input type="text" class="search-input" placeholder="Search conversations...">
  </div>

  <div class="section-title">AI COACHES</div>

  <!-- Chat List -->
  <div class="chat-list">
    @for (coach of aiCoaches; track coach.id) {
      <div 
        class="chat-item" 
        [class.active]="activeChatId === coach.id"
        (click)="onSelectChat(coach)">
        
        <div class="avatar-wrapper">
          <div class="avatar" [style.backgroundColor]="coach.avatarColor">
            {{ coach.icon }}
          </div>
          @if(coach.isOnline) {
            <span class="status-indicator online"></span>
          }
        </div>

        <div class="chat-info">
          <div class="chat-header">
            <span class="chat-name">{{ coach.name }}</span>
            <span class="chat-time">{{ coach.time }}</span>
          </div>
          <div class="chat-snippet">
            <span class="message-preview">{{ coach.lastMessage }}</span>
            @if(coach.unreadCount > 0) {
              <span class="unread-badge">{{ coach.unreadCount }}</span>
            }
          </div>
        </div>
      </div>
    }
  </div>

  <!-- Bottom Stats -->
  <div class="stats-card">
    <div class="stat-col">
      <span class="stat-icon fire">🔥</span>
      <strong class="stat-val">1,240</strong>
      <span class="stat-lbl">kcal</span>
    </div>
    <div class="stat-col">
      <span class="stat-icon drop">💧</span>
      <strong class="stat-val blue">2.1L</strong>
      <span class="stat-lbl">water</span>
    </div>
    <div class="stat-col">
      <span class="stat-icon run">🏃</span>
      <strong class="stat-val">6,480</strong>
      <span class="stat-lbl">steps</span>
    </div>
  </div>
</aside>
